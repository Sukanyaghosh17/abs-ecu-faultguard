name: CMake Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Smoke-test executable
        # timeout exits with code 124 when the time limit is reached — that's
        # expected and fine (the sim loops for ~20+ seconds normally).
        # Any other non-zero exit code (crash, segfault, etc.) fails the build.
        run: |
          timeout 5 ./build/abs_ecu_sim; code=$?
          if [ $code -ne 0 ] && [ $code -ne 124 ]; then exit 1; fi
